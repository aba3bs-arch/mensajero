<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: transparent;
      padding: 4px 0;
      -webkit-tap-highlight-color: transparent;
    }
    .lcd {
      background: linear-gradient(180deg, #1a2e1a, #0a140a);
      border: 3px solid #4a5a4a;
      border-radius: 8px;
      padding: 14px;
      margin-bottom: 12px;
      text-align: center;
      box-shadow: inset 0 4px 12px rgba(0,0,0,0.5);
    }
    .lcd-label {
      color: #6a9f6a;
      font-size: 10px;
      letter-spacing: 3px;
      text-transform: uppercase;
      margin-bottom: 8px;
      font-family: Consolas, monospace;
    }
    .lcd-dots {
      color: #5cff5c;
      font-size: 28px;
      letter-spacing: 14px;
      font-family: Consolas, monospace;
      text-shadow: 0 0 10px rgba(92,255,92,0.4);
    }
    .panel {
      background: #c4c4c4;
      border: 4px solid #7a7a7a;
      border-radius: 10px;
      padding: 12px 10px;
      box-shadow: 0 6px 18px rgba(0,0,0,0.2), inset 0 1px 0 rgba(255,255,255,0.35);
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
    }
    .key, .empty {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 52px;
      border-radius: 6px;
      border: none;
      cursor: pointer;
      touch-action: manipulation;
      -webkit-user-select: none;
      user-select: none;
    }
    .key {
      background: linear-gradient(180deg, #3d3d3d, #1a1a1a 55%, #0d0d0d);
      color: #fff;
      font-weight: 700;
      border: 2px solid #000;
      box-shadow: 0 4px 0 #000, inset 0 1px 0 rgba(255,255,255,0.1);
    }
    .key:active { transform: translateY(3px); box-shadow: 0 1px 0 #000; }
    .key-num { font-size: 22px; }
    .key-act {
      font-size: 9px;
      font-weight: 800;
      letter-spacing: 0.2px;
      line-height: 1.15;
      padding: 4px 2px;
    }
    .key-cancel {
      background: linear-gradient(180deg, #e53935 0%, #e53935 6px, #2a2a2a 6px, #1a1a1a 100%);
    }
    .key-back {
      background: linear-gradient(180deg, #fbc02d 0%, #fbc02d 6px, #2a2a2a 6px, #1a1a1a 100%);
    }
    .key-enter {
      background: linear-gradient(180deg, #43a047 0%, #43a047 6px, #2a2a2a 6px, #1a1a1a 100%);
    }
    .empty {
      background: linear-gradient(180deg, #2e2e2e, #1a1a1a);
      border: 2px solid #111;
      opacity: 0.4;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div class="lcd">
    <div class="lcd-label">Ingrese su PIN</div>
    <div class="lcd-dots" id="dots">○ ○ ○ ○</div>
  </div>
  <div class="panel">
    <div class="grid" id="grid"></div>
  </div>

  <script src="./streamlit-component-lib.js"></script>
  <script>
    let pinLength = 4;
    let value = "";

    const layout = [
      ["1", "2", "3", { a: "clear", l: "CANCELAR", c: "key-cancel" }],
      ["4", "5", "6", { a: "back", l: "BORRAR", c: "key-back" }],
      ["7", "8", "9", { a: "enter", l: "ENTRAR", c: "key-enter" }],
      [null, "0", null, null],
    ];

    function updateDots() {
      let s = "";
      for (let i = 0; i < pinLength; i++) {
        s += (i < value.length ? "●" : "○") + " ";
      }
      document.getElementById("dots").textContent = s.trim();
    }

    function send() {
      Streamlit.setComponentValue(value);
    }

    function onAction(action) {
      if (action === "clear") value = "";
      else if (action === "back") value = value.slice(0, -1);
      else if (action === "enter") {
        Streamlit.setComponentValue("__enter__:" + value);
        return;
      } else if (/^\d$/.test(action) && value.length < pinLength) {
        value += action;
      }
      updateDots();
      send();
    }

    function buildGrid() {
      const grid = document.getElementById("grid");
      grid.innerHTML = "";
      layout.forEach((row) => {
        row.forEach((cell) => {
          if (cell === null) {
            const e = document.createElement("div");
            e.className = "empty";
            grid.appendChild(e);
            return;
          }
          if (typeof cell === "object") {
            const btn = document.createElement("button");
            btn.type = "button";
            btn.className = "key key-act " + cell.c;
            btn.textContent = cell.l;
            btn.addEventListener("click", () => onAction(cell.a));
            grid.appendChild(btn);
            return;
          }
          const btn = document.createElement("button");
          btn.type = "button";
          btn.className = "key key-num";
          btn.textContent = cell;
          btn.addEventListener("click", () => onAction(cell));
          grid.appendChild(btn);
        });
      });
    }

    function onRender(event) {
      const args = event.detail.args;
      pinLength = args.pin_length || 4;
      value = args.value || "";
      updateDots();
    }

    buildGrid();
    Streamlit.setComponentReady();
    Streamlit.events.addEventListener(Streamlit.RENDER_EVENT, onRender);
  </script>
</body>
</html>
