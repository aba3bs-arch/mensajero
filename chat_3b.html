<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>3B Official</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        :root {
            --rojo: #C8102E;
            --amarillo-claro: #E8DC6B;
            --azul: #1E5AA8;
            --fondo-lista: #C4B82E;
            --texto: #111;
        }
        body {
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(rgba(0,0,0,0.35), rgba(0,0,0,0.35)),
                url('https://images.unsplash.com/photo-1542838132-92c53300491e?w=1200&q=80') center/cover no-repeat fixed;
            padding: 12px;
        }
        .phone-container {
            width: 100%;
            max-width: 390px;
            height: min(844px, 96vh);
            background: var(--fondo-lista);
            border: 7px solid #1a1a1a;
            border-radius: 36px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.45);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .header-sticky { background: var(--rojo); color: #fff; flex-shrink: 0; z-index: 20; }
        .header-top { display: flex; align-items: center; padding: 10px 12px 6px; gap: 8px; }
        .header-top h1 { flex: 1; font-size: 15px; font-weight: 800; letter-spacing: 0.3px; line-height: 1.2; }
        .header-icons { display: flex; gap: 14px; align-items: center; }
        .tabs-row { display: flex; align-items: center; padding: 0 8px 0 12px; border-bottom: 3px solid #fff; }
        .tabs-camera { padding: 10px 10px 10px 0; }
        .tabs { flex: 1; display: flex; justify-content: space-around; padding: 10px 0 8px; }
        .tabs button {
            background: none; border: none; color: #fff; font-weight: 700; font-size: 11px;
            letter-spacing: 0.6px; cursor: pointer; opacity: 0.65; padding-bottom: 4px;
            border-bottom: 3px solid transparent; margin-bottom: -3px;
        }
        .tabs button.active { opacity: 1; border-bottom-color: #fff; }
        .view { display: none; flex-direction: column; flex: 1; min-height: 0; }
        .view.active { display: flex; }
        .chat-list { flex: 1; overflow-y: auto; background: var(--fondo-lista); }
        .chat-item {
            display: flex; align-items: center; padding: 12px 14px; gap: 12px; cursor: pointer;
            border-bottom: 1px solid rgba(0,0,0,0.06); transition: background 0.15s;
        }
        .chat-item:hover { background: rgba(255,255,255,0.12); }
        .chat-item .avatar {
            width: 48px; height: 48px; border-radius: 50%; background: #fff;
            border: 2px solid var(--rojo); flex-shrink: 0;
            display: flex; align-items: center; justify-content: center;
        }
        .chat-item .meta { flex: 1; min-width: 0; }
        .chat-item .row1 { display: flex; justify-content: space-between; margin-bottom: 3px; }
        .chat-item .name { font-weight: 700; font-size: 15px; }
        .chat-item .hora { font-size: 11px; color: #444; }
        .chat-item .preview {
            font-size: 13px; color: #333; white-space: nowrap; overflow: hidden;
            text-overflow: ellipsis; display: flex; gap: 4px;
        }
        .checks { color: var(--azul); font-size: 12px; letter-spacing: -2px; margin-left: auto; }
        .ribbon-banner {
            margin: 8px 14px; background: var(--azul); color: #fff; text-align: center;
            font-weight: 800; font-size: 13px; padding: 6px 12px; border-radius: 4px;
        }
        .contact-bar {
            background: var(--amarillo-claro); padding: 10px 14px; display: flex;
            align-items: center; gap: 12px; flex-shrink: 0;
            border-bottom: 1px solid rgba(0,0,0,0.08);
        }
        .contact-bar .back {
            background: none; border: none; font-size: 26px; cursor: pointer;
            color: var(--texto); line-height: 1; padding: 0 4px;
        }
        .contact-bar .avatar-sm {
            width: 40px; height: 40px; border-radius: 50%; background: #fff;
            border: 2px solid var(--rojo); display: flex; align-items: center; justify-content: center;
        }
        .contact-bar h4 { font-size: 15px; font-weight: 700; }
        .contact-bar p { font-size: 12px; color: #555; }
        .chat-messages {
            flex: 1; overflow-y: auto; padding: 14px 12px;
            display: flex; flex-direction: column; gap: 10px; background: var(--fondo-lista);
        }
        .msg {
            max-width: 82%; padding: 9px 12px 6px; font-size: 14px; line-height: 1.35;
            box-shadow: 0 1px 2px rgba(0,0,0,0.12);
        }
        .msg.received {
            background: var(--amarillo-claro); color: var(--texto);
            border-radius: 14px 14px 14px 2px; align-self: flex-start;
        }
        .msg.sent {
            background: var(--rojo); color: #fff;
            border-radius: 14px 14px 2px 14px; align-self: flex-end;
        }
        .time { font-size: 10px; text-align: right; margin-top: 4px; opacity: 0.75; }
        .input-bar {
            background: #e8e4d0; padding: 8px 10px 10px; display: flex;
            align-items: center; gap: 8px; flex-shrink: 0;
            border-top: 1px solid rgba(0,0,0,0.08);
        }
        .input-wrap {
            flex: 1; display: flex; align-items: center; background: #fff;
            border-radius: 24px; padding: 0 6px 0 12px;
            border: 1px solid rgba(0,0,0,0.08); min-height: 42px;
        }
        .input-wrap .ico { color: #888; font-size: 18px; padding: 0 6px; cursor: pointer; }
        .input-wrap input {
            flex: 1; border: none; outline: none; font-size: 14px;
            padding: 10px 4px; background: transparent;
        }
        .btn-send {
            width: 44px; height: 44px; border-radius: 50%; background: var(--azul);
            border: none; color: #fff; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 2px 6px rgba(30,90,168,0.4); flex-shrink: 0;
        }
        .placeholder-tab {
            flex: 1; display: flex; align-items: center; justify-content: center;
            color: #555; font-size: 14px; background: var(--fondo-lista);
        }
        #panel-list, #panel-chat { flex: 1; min-height: 0; display: flex; flex-direction: column; }
        #panel-chat { display: none; }
        .logo-3b { position: relative; flex-shrink: 0; }
        .logo-3b .logo-img { height: 48px; width: auto; display: block; object-fit: contain; }
        .logo-3b .logo-fallback { display: none; }
        .logo-3b.use-fallback .logo-img { display: none; }
        .logo-3b.use-fallback .logo-fallback { display: block; }
        .avatar .logo-img, .avatar-sm .logo-img {
            width: 100%; height: 100%; object-fit: cover; border-radius: 50%;
        }
    </style>
</head>
<body>

<div class="phone-container">
    <header class="header-sticky">
        <div class="header-top">
            <div class="logo-3b" id="logoHeader">
                <img src="logo_3b.png" alt="Logo Abarrotes Las 3B" class="logo-img logo-file">
                <svg class="logo-fallback" width="42" height="48" viewBox="0 0 90 100" aria-hidden="true">
                    <path d="M45 4 L82 88 L8 88 Z" fill="#F5D000" stroke="#fff" stroke-width="3"/>
                    <text x="45" y="28" text-anchor="middle" font-family="Arial Black,sans-serif" font-size="9" fill="#C8102E" font-weight="bold">ABARROTES</text>
                    <text x="45" y="58" text-anchor="middle" font-family="Arial Black,sans-serif" font-size="26" fill="#111" font-weight="bold">3B</text>
                    <rect x="18" y="68" width="54" height="14" rx="2" fill="#1E5AA8"/>
                    <text x="45" y="79" text-anchor="middle" font-family="Arial,sans-serif" font-size="9" fill="#fff" font-weight="bold">24 HRS</text>
                </svg>
            </div>
            <h1>3B OFFICIAL</h1>
            <div class="header-icons">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
                <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="5" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="12" cy="19" r="2"/></svg>
            </div>
        </div>
        <div class="tabs-row">
            <span class="tabs-camera">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><path d="M23 19a2 2 0 01-2 2H3a2 2 0 01-2-2V8a2 2 0 012-2h4l2-3h6l2 3h4a2 2 0 012 2z"/><circle cx="12" cy="13" r="4"/></svg>
            </span>
            <nav class="tabs">
                <button type="button" class="tab-btn active" data-tab="chats">CHATS</button>
                <button type="button" class="tab-btn" data-tab="status">STATUS</button>
                <button type="button" class="tab-btn" data-tab="settings">SETTINGS</button>
            </nav>
        </div>
    </header>

    <section id="view-chats" class="view active">
        <div id="panel-list">
            <div class="ribbon-banner">24 HRS • En línea</div>
            <div class="chat-list">
                <article class="chat-item" data-chat="maria">
                    <div class="avatar"><img src="logo_3b.png" alt="" class="logo-img logo-file"></div>
                    <div class="meta">
                        <div class="row1"><span class="name">María G.</span><span class="hora">14:40</span></div>
                        <div class="preview"><span>¡Hola, Doña María! ¿Tendrá huevo...</span><span class="checks">✓✓</span></div>
                    </div>
                </article>
                <article class="chat-item" data-chat="misael">
                    <div class="avatar"><img src="logo_3b.png" alt="" class="logo-img logo-file"></div>
                    <div class="meta">
                        <div class="row1"><span class="name">Misael</span><span class="hora">14:32</span></div>
                        <div class="preview"><span>Ya quedó listo el mantenimiento...</span><span class="checks">✓✓</span></div>
                    </div>
                </article>
            </div>
        </div>

        <div id="panel-chat">
            <div class="contact-bar">
                <button type="button" class="back" id="btnBack" aria-label="Volver">‹</button>
                <div class="avatar-sm" id="chatAvatar"></div>
                <div><h4 id="chatTitle">María G.</h4><p id="chatStatus">en línea</p></div>
            </div>
            <div class="chat-messages" id="chatBox"></div>
            <form class="input-bar" id="formSend">
                <div class="input-wrap">
                    <span class="ico">📎</span>
                    <input type="text" id="msgInput" placeholder="Mensaje" autocomplete="off">
                    <span class="ico">📷</span>
                </div>
                <button type="submit" class="btn-send" aria-label="Enviar">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
                </button>
            </form>
        </div>
    </section>

    <section id="view-status" class="view"><div class="placeholder-tab">Estados — próximamente</div></section>
    <section id="view-settings" class="view"><div class="placeholder-tab">Ajustes — próximamente</div></section>
</div>

<script>
const conversaciones = {
    maria: {
        nombre: 'María G.',
        mensajes: [
            { tipo: 'received', texto: '¡Hola, Doña María! ¿Tendrá huevos?', hora: '14:38' },
            { tipo: 'sent', texto: '¡Hola, Doña María! Sí tenemos huevo en sucursal Juárez. ¿Cuántas cartillas?', hora: '14:40', checks: true },
            { tipo: 'received', texto: 'Me pone dos cartillas, por favor. Gracias.', hora: '14:41' },
            { tipo: 'sent', texto: 'Listo, se las aparto enseguida.', hora: '14:42', checks: true }
        ]
    },
    misael: {
        nombre: 'Misael',
        mensajes: [
            { tipo: 'received', texto: '¡Hola, Andrés! Ya quedó listo el mantenimiento del extractor en la sucursal 3.', hora: '14:32' },
            { tipo: 'sent', texto: '¡Excelente, Misael! ¿Revisaste la cortina?', hora: '14:35', checks: true }
        ]
    }
};
let chatActivo = null;

function logoAvatarHtml() {
    return '<img src="logo_3b.png" alt="" class="logo-img logo-file" onerror="this.parentElement.textContent=\'3B\'">';
}
document.querySelectorAll('.logo-file').forEach(function(img) {
    img.addEventListener('error', function() {
        var wrap = this.closest('.logo-3b');
        if (wrap) wrap.classList.add('use-fallback');
        else if (this.closest('.avatar, .avatar-sm')) this.replaceWith(document.createTextNode('3B'));
    });
});
function renderMensajes(msgs) {
    return msgs.map(function(m) {
        var checks = m.checks ? ' <span style="color:#7ec8ff">✓✓</span>' : '';
        return '<div class="msg '+m.tipo+'">'+m.texto+'<div class="time">'+m.hora+(m.tipo==='sent'?checks:'')+'</div></div>';
    }).join('');
}
function abrirChat(id) {
    var c = conversaciones[id];
    if (!c) return;
    chatActivo = id;
    document.getElementById('panel-list').style.display = 'none';
    document.getElementById('panel-chat').style.display = 'flex';
    document.getElementById('chatTitle').textContent = c.nombre;
    document.getElementById('chatAvatar').innerHTML = logoAvatarHtml();
    var box = document.getElementById('chatBox');
    box.innerHTML = renderMensajes(c.mensajes);
    box.scrollTop = box.scrollHeight;
}
function cerrarChat() {
    chatActivo = null;
    document.getElementById('panel-list').style.display = 'flex';
    document.getElementById('panel-chat').style.display = 'none';
}
document.querySelectorAll('.chat-item').forEach(function(el) {
    el.addEventListener('click', function() { abrirChat(el.dataset.chat); });
});
document.getElementById('btnBack').addEventListener('click', cerrarChat);
document.getElementById('formSend').addEventListener('submit', function(e) {
    e.preventDefault();
    var input = document.getElementById('msgInput');
    var texto = input.value.trim();
    if (!texto || !chatActivo) return;
    var hora = new Date().toLocaleTimeString('es-MX', { hour: '2-digit', minute: '2-digit' });
    conversaciones[chatActivo].mensajes.push({ tipo: 'sent', texto: texto, hora: hora, checks: true });
    var box = document.getElementById('chatBox');
    box.innerHTML = renderMensajes(conversaciones[chatActivo].mensajes);
    input.value = '';
    box.scrollTop = box.scrollHeight;
});
document.querySelectorAll('.tab-btn').forEach(function(btn) {
    btn.addEventListener('click', function() {
        document.querySelectorAll('.tab-btn').forEach(function(b) { b.classList.remove('active'); });
        btn.classList.add('active');
        var tab = btn.dataset.tab;
        document.querySelectorAll('.view').forEach(function(v) { v.classList.remove('active'); });
        document.getElementById('view-' + tab).classList.add('active');
        if (tab !== 'chats') cerrarChat();
        else if (!chatActivo) {
            document.getElementById('panel-list').style.display = 'flex';
            document.getElementById('panel-chat').style.display = 'none';
        }
    });
});
</script>
</body>
</html>
